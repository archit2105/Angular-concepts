<div class="enrollment-container">
    <h2>Patient Enrollment</h2>
    <!-- Enrollment Form -->
    <form [formGroup]="enrollmentForm" (ngSubmit)="onSubmit()">
    <!-- Patient ID (Auto Generated - Readonly) -->
    <div class="form-group">
    <label>Patient ID</label>
    <input type="text" formControlName="patientId" readonly />
    </div>
    <!-- Full Name -->
    <div class="form-group">
    <label>Full Name *</label>
    <input type="text" formControlName="fullName" />
    <small class="error" *ngIf="f.fullName.touched && f.fullName.invalid">
           Full name is required (min 3 characters)
    </small>
    </div>
   <!-- Email -->
    <div class="form-group">
      <label>Email *</label>
      <input type="email" formControlName="email" />
      
      <!-- Check for required error -->
      <small class="error" *ngIf="f.email.touched && f.email.errors?.['required']">
        Email is required
      </small>
      
      <!-- Check for regex pattern error -->
      <small class="error" *ngIf="f.email.touched && f.email.errors?.['pattern']">
        Enter a valid email address (e.g., user@domain.com)
      </small>
    </div>
    <!-- Phone -->
    <div class="form-group">
    <label>Phone Number *</label>
    <input type="text" formControlName="phone" />
    <small class="error" *ngIf="f.phone.touched && f.phone.invalid">
           Enter valid 10-digit mobile number
    </small>
    </div>
    <!-- Date of Birth -->
    <div class="form-group">
    <label>Date of Birth *</label>
    <input type="date" formControlName="dob" />
    <small class="error" *ngIf="f.dob.errors?.['underAge']">
           Patient must be at least 18 years old
    </small>
    </div>
    <!-- Gender -->
    <div class="form-group">
    <label>Gender *</label>
    <select formControlName="gender">
    <option value="">Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
    </select>
    </div>
    <!-- Blood Group -->
    <div class="form-group">
    <label>Blood Group *</label>
    <select formControlName="bloodGroup">
    <option value="">Select Blood Group</option>
    <option>A+</option>
    <option>A-</option>
    <option>B+</option>
    <option>B-</option>
    <option>O+</option>
    <option>O-</option>
    <option>AB+</option>
    <option>AB-</option>
    </select>
    </div>
    <!-- Chronic Conditions -->
    <div class="form-group">
    <label>Chronic Conditions</label>
    <select formControlName="conditions" multiple>
    <option value="Diabetes">Diabetes</option>
    <option value="Hypertension">Hypertension</option>
    <option value="Asthma">Asthma</option>
    <option value="Heart Disease">Heart Disease</option>
    </select>
    </div>
    <!-- Emergency Contact -->
    <div class="form-group">
    <label>Emergency Contact Name *</label>
    <input type="text" formControlName="emergencyName" />
    </div>
    <div class="form-group">
    <label>Emergency Contact Phone *</label>
    <input type="text" formControlName="emergencyPhone" />
    <small class="error" *ngIf="f.emergencyPhone.touched && f.emergencyPhone.invalid">
           Enter valid emergency contact number
    </small>
    </div>
    <!-- File Upload -->
    <div class="form-group">
    <label>Medical Report (PDF/JPG/PNG, Max 5MB) *</label>
    <input type="file" (change)="onFileChange($event)" />
    </div>
    <!-- Consent Checkbox -->
    <div class="form-group checkbox">
    <input type="checkbox" formControlName="consent" />
    <label>I agree to share my medical data</label>
    <small class="error" *ngIf="f.consent.touched && f.consent.invalid">
           Consent is mandatory
    </small>
    </div>
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
         {{ errorMessage }}
    </div>
    <!-- Submit Button -->
    <button type="submit" [disabled]="loading">
         {{ loading ? 'Processing...' : 'Submit Enrollment' }}
    </button>
    </form>
    </div>
